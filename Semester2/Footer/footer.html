<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footer</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body {
        background-color: antiquewhite;
        color: #555;
        line-height: 1.7;
        margin: 0;
      }
      h1 {
        padding: 1rem;
        text-align: center;
        color: orangered;
      }
      #pagefooter {
        border-top: 1px solid silver;
        background-color: lightyellow;
        padding: 1rem;
        text-align: center;
        display: flex;
        flex-direction: column;
      }
      #pagefooter > p {
        padding: 1rem;
      }
      #pagefooter > article {
        padding: 1rem;
      }
      i {
        color: orangered;
        font-size: 1.2rem;
        margin-left: 0.3rem;
        margin-right: 0.3rem;
      }
      i.fa-paw {
        transform: rotate(45deg);
      }
      @media screen and (min-width: 700px) {
        #pagefooter {
          text-align: left;
          flex-direction: row;
          justify-content: space-between;
        }
      }
    </style>
  </head>
  <body>
    <h1>Footer</h1>
   <footer id="pagefooter">
        <p>
          <i class="fas fa-paw"></i>Paws & Whiskers <br />
          Made with <i class="fas fa-heart"></i> for furry friends
        </p>
        <article>
          <i class="fas fa-phone"></i>559-935-7520 <br />
          <i class="fas fa-envelope"></i> info@pawsandwhiskers.com <br />
          <i class="fas fa-map-marker-alt"></i> 750 Van Ness St., Coalinga, CA 93210
        </article>
   </footer id="pagefooter">
  </body>
</html>
