<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards</title>
    <style>
        body {
            background-color: #444;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            text-align: center;
            text-transform: uppercase;
        }
        .card {
            padding: 1.5rem;
            background-color: #333;
            width: 80%;
            margin: auto;
            margin-bottom: 2rem;
            border-radius: 1rem;
            box-shadow: 5px 5px 5px 5px black;
        }
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* h2 {

        }
        iframe {

        }
        #playlist1 {

        }
        #playlist2 { 

        }
        #playlist3 { 

        } */
         @media screen and (min-width: 1280px) {
            .container {
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                gap: 2rem;
                margin: auto;
            }
          }
    </style>
  </head>
  <body>
    <h1>Cards</h1>
    <div class="container">
      <section class="card" >
          <iframe id="playlist1"
            data-testid="embed-iframe"
            style="border-radius: 12px"
            src="https://open.spotify.com/embed/playlist/3jPrLgPVwABbnfZI6BiQZj?utm_source=generator"
            width="100%"
            height="352"
            frameborder="0"
            allowfullscreen=""
            allow="
              autoplay;
              clipboard-write;
              encrypted-media;
              fullscreen;
              picture-in-picture;
            "
            loading="lazy"
          ></iframe>
      </section class="card"   >
      <section class="card">
          <iframe id="playlist2"
            data-testid="embed-iframe"
            style="border-radius: 12px"

            width="100%"
            height="352"
            frameborder="0"
            allowfullscreen=""
            allow="
              autoplay;
              clipboard-write;
              encrypted-media;
              fullscreen;
              picture-in-picture;
            "
            loading="lazy"
          ></iframe>
      </section>
      <section class="card">
          <iframe id="playlist3"
        data-testid="embed-iframe"
        style="border-radius: 12px"
        src="https://open.spotify.com/embed/playlist/7ewzsYeLZX6m3LC9Ve37YL?utm_source=generator"
        width="100%"
        height="352"
        frameborder="0"
        allowfullscreen=""

          autoplay;

          fullscreen;
          picture-in-picture;
        "
        loading="lazy"
      ></section>
    </div class="container">
