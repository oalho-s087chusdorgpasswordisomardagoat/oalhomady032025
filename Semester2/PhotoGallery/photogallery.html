<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Photo Gallery</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: darkslateblue;
      }
      h1 {
        text-align: center;
        color: thistle;
      }
      figure {
        background-color: white;
        width: 100%;
        max-width: 250px;
        padding: 1rem;
        margin: 1rem;
      }
      figcaption {
        text-align: center;
        color: #555;
        padding: 0.5rem;
      }
      img {
        width: 100%;
        aspect-ratio: 1 / 1;
      }
      .gallery {
        background-color: skyblue;
        border: 4px solid steelblue;
        width: 90%;
        max-width: 1280px;
        margin: auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }
    </style>
  </head>
